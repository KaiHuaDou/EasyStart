name: .NET Build

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.x

      - name: Publish App
        run: dotnet publish -p:PublishProfile=FolderProfile

      - name: Upload App
        uses: actions/upload-artifact@v7
        with:
          name: EasyStart
          path: ./StartPro/bin/publish/*
